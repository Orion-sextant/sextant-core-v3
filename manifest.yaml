# Sextant Core manifest. Values marked TO_FILL are populated during
# implementation; the freeze gate (PROTOCOL_v3.md section 22) requires
# every TO_FILL to be resolved and every hash recorded.
protocol:
  name: sextant_core
  version: "3.1"                   # v3.0 + owner-authorized cell-policy amendment
  amendment: docs/PROTOCOL_v3.1_amendment.md   # decouples attn inner dim from d_model
  status: preregistration_draft   # -> frozen at the gate
  protocol_sha256: 622de4f0d32df72640910105d4224b40f2e4846489084ec90fa4d9f1bbfe0003
  repository_commit: TO_FILL

attribution_frame:
  hypothesis_labels:
    H1: matched_budget_implementation
    H2: selected_algebraic_structure_vs_selected_monarch_control
    H3: cocycle_twisted_law
  prohibited_labels: [generic_structure, algebra_vs_sparsity, noncommutativity_proves_order]

algebra:
  component_count: 8
  basis_order: [1, e1, e2, e12, e3, e13, e23, e123]
  grade_map: [0, 1, 1, 2, 1, 2, 2, 3]
  action: left_multiplication
  cocycle: "B(x,y) = sum_{j<i} x_i y_j mod 2"
  structure_tensor_builder: reference/structure_tensor.py
  structure_tensor_sha256_C: 713a123162a477fd3ffd65d603f4e1a66f32f890a1ff5b83048389c352d00510
  structure_tensor_sha256_D: d32b608bfe07048789eb99854f644602b2f102af8952370fd6d98476af34a4da
  rank_catalogue_verifier: reference/verify_algebra.py

data_contract:
  corpus: HuggingFaceFW/fineweb-edu
  configuration: sample-10BT
  revision_hash: 87f09149ef4734204d70ed1d046ddc9ca3f2b8f9  # HF main revision at freeze-prep; comparative download must pin this
  train_tokens_per_run: 2_000_000_000
  validation_tokens: 20_000_000
  split_manifest_sha256: TO_FILL
  tokenizer: gpt2_bpe_50257
  tokenizer_sha256: 1fe93b6152957cf9cfd6d89002467f789ce8b3f3e000b3a2edf27c808ddd0b9e
  sequence_length: 1024
  packing: contiguous_eos_separated_causal_only
  comparative_seeds: [1, 2, 3]
  replacement_seed_reserve: [11, 12, 13]
  smoke_data_disjoint: true

model_policy:
  depth_blocks: 8
  head_dim: 64
  d_ff_multiplier: 4
  architecture: prenorm_transformer_rope
  constrained_set: [wq, wk, wv, wo, mlp_in, mlp_out]
  embeddings: {tied_with_head: true, precision: fp16, in_constrained_budget: false}
  # v3.1: attention inner dim decoupled from d_model.
  attention:
    n_heads_rule: floor(d_model/64 + 0.5)   # half rounds up
    attn_inner: n_heads*64                   # Q,K,V: d_model->inner; O: inner->d_model
  divisibility: {d_model_by_8: [C, D], d_ff_by_8: true, head_dim_by_8: true, attn_inner_by_8: true}
  layout:
    components_contiguous: true
    no_group_crosses_head_boundary: true
    residual_component_alignment: true
    attn_inner_divisible_by_8: true          # v3.1 layout invariant
    tensor_parallel_split_of_group: prohibited

budgets:
  target_actual_constrained_bytes: {low: 2_500_000, high: 10_000_000}
  maximum_relative_mismatch: 0.01
  dimension_search: minimize_abs_byte_gap_over_d_model_multiples_of_8_tiebreak_smaller
  dimension_search_algorithm_sha256: ebe71573061e5b937d194391fe680cee70f572246e3869512195803d49f8db71
  model_cells:   # FROZEN by the v3.1 solver (docs/PROTOCOL_v3.1_amendment.md)
    A_low:  {d_model: 356, n_heads: 6, attn_inner: 384, actual_constrained_bytes: 2506324, rel_err: +0.00253, cell_sha256: 06d572c42c840dd8e488c3304fcfd819}
    B_low:  {d_model: 1472, n_heads: 23, attn_inner: 1472, actual_constrained_bytes: 2508389, rel_err: +0.00336, monarch_grid_g_per_map: choose_blocks, cell_sha256: ef6c0d7346b9fda3a4b2fdd62dafeecf}
    C_low:  {d_model: 1016, n_heads: 16, attn_inner: 1024, actual_constrained_bytes: 2492789, rel_err: -0.00288, cell_sha256: 9c5891a298c99c36e2f4e2f570181c31}
    D_low:  {d_model: 1016, n_heads: 16, attn_inner: 1024, actual_constrained_bytes: 2492837, rel_err: -0.00287, cell_sha256: d494f2be34eebdead885aaf9680ed3da}
    A_high: {d_model: 725, n_heads: 11, attn_inner: 704, actual_constrained_bytes: 10002070, rel_err: +0.00021, cell_sha256: aca2a4715bec8090de29ec8e05331c68}
    B_high: {d_model: 2800, n_heads: 44, attn_inner: 2816, actual_constrained_bytes: 10077570, rel_err: +0.00776, monarch_grid_g_per_map: choose_blocks, cell_sha256: 035baaf095e0e03b9c430f73d3aead08}
    C_high: {d_model: 2040, n_heads: 32, attn_inner: 2048, actual_constrained_bytes: 10009015, rel_err: +0.00090, cell_sha256: b6086457dacb4c023a71f87473c8a4d2}
    D_high: {d_model: 2040, n_heads: 32, attn_inner: 2048, actual_constrained_bytes: 10009063, rel_err: +0.00091, cell_sha256: 3a0a5a6c64c0962ada7a2ec91267c8b8}

packer:
  trit_encoding: base243_five_trits_per_byte
  tensor_order: row_major_O_I_8
  alignment_bytes: 64
  scale: {granularity: per_constrained_tensor, dtype: fp16}
  header: json_with_per_tensor_offsets_and_shapes
  serializer_sha256: a921a53770aa18f2b3aa28057fc6545ecde90d487f768172b82960f979e50a47
  deserializer_sha256: 4096e5ffc1b34c95964d65e51399304119b37726d07b05f1228c4f760163e9f9  # base-243 codec; unpack_model lives in serializer (hashed above)

training:
  optimizer: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: {value: 0.1, applies_to: constrained_shadow_tensors_only}
  grad_clip: 1.0
  schedule: {warmup_fraction: 0.02, decay: cosine, min_lr_fraction_of_peak: 0.10}
  effective_batch_tokens: 500_000
  precision: bf16_autocast_fp32_master
  checkpoint_every_tokens: 200_000_000
  eval_every_tokens: 100_000_000
  checkpoint_selection: best_validation_loss
  init: {law: normal_std_0.02, residual_scale: inv_sqrt_2_depth, cd_paired_draws: true}
  lr_fairness_stage:
    grid_peak_lr: [1.0e-3, 2.0e-3, 4.0e-3]
    smoke_tokens_per_point: 100_000_000
    selection_rule: lowest_smoke_val_loss_tiebreak_lower_lr
    selected_peak_lr:
      A_low: 0.001
      B_low: 0.004
      C_low: 0.002
      D_low: 0.001
      A_high: 0.001
      B_high: 0.002
      C_high: 0.002
      D_high: 0.001

probe:
  items: 200
  templates: 20
  variants_per_template: 10
  schema_facts: 24
  task: multilabel_fact_assertion
  representation: {layer: block_4_output, pooling: mean, checkpoint: selected}
  readout: {method: ridge, lambda: 1.0, features: standardized}
  metric: macro_f1
  split: {train_templates: 12, eval_templates: 8, by: template_id}
  bootstrap: {replicates: 10000, cluster: template_id, ci: 0.95, role: descriptive_only}
  minimum_effect_f1_points: 3
  generator_seed: 20260806
  generator_sha256: e435aef637d4241962a25da639e36063aa9fbc296e9cc7a1c50a0171e0a67e9d

decision_rule:
  margin_relative: 0.02
  sign_consistency: all_three_seeds
  equivalence_band_relative: 0.02
  both_budgets_required_for_scaleup: true
  p_values_for_loss_decision: prohibited
  analysis_code_sha256: b7add5e35e39a6a0fb02712210ab476687f2093582e79473d74a0cb631563450

failure_handling:
  nan_or_overflow: invalidate_run
  replacement: one_seed_from_reserve_in_order
  failed_runs: retained_in_ledger_marked_invalid
  interrupted_runs: resume_from_checkpoint_else_failed

leakage_control:
  comparative_start_requires_all_arms: true
  comparative_curves_before_freeze: prohibited
  smoke_in_analysis: prohibited
  post_freeze_hyperparameter_change: prohibited
  post_freeze_code_change: invalidates_affected_family_and_bumps_version

freeze_gate:
  authorized_by_owner: false   # flip only with explicit sign-off
  authorized_utc: TO_FILL
